[package]
name = "bugar"
version = "0.1.0"
edition = "2021"
authors = ["Faisal <faisal@bugar.local>"]
description = "All-in-One Fitness, Nutrition & Fat Burner Edge Server for ODROID-C2 (ARM64)"
license = "MIT"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rust-embed = { version = "8.4", features = ["mime-guess"] }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "compression-gzip"] }
clap = { version = "4.5", features = ["derive", "env"] }
sha2 = "0.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
